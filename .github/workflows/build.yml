name: nf-prov CI
on:
  push:
    branches:
      - 'main'
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
jobs:
  build:
    name: Build nf-prov
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        java_version: [17]
        nextflow_version: ['25.10']

    steps:
      - name: Environment
        run: env | sort

      - name: Checkout
        uses: actions/checkout@v1
        with:
          fetch-depth: 1
          submodules: true

      - name: Setup Java ${{ matrix.java_version }}
        uses: actions/setup-java@v1
        with:
          java-version: ${{matrix.java_version}}
          architecture: x64
          distribution: 'temurin'

      - name: Unit tests
        run: make test
        env:
          GRADLE_OPTS: '-Dorg.gradle.daemon=false'

      - name: Setup Nextflow ${{ matrix.nextflow_version }}
        uses: nf-core/setup-nextflow@b9f764e8ba5c76b712ace14ecbfcef0e40ae2dd8 # v1
        with:
          version: "${{ matrix.nextflow_version }}"

      - name: Install
        run: make install

      - name: Test
        run: nextflow run nf-prov-test/ -plugins nf-prov@$(cat VERSION)

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate RO-Crate
        run: |
          pip install roc-validator
          rocrate-validator validate --no-paging --verbose -p provenance-run-crate-0.5 results

      # fetch schema from GitHub since the IEEE host rejects non-browser clients
      - name: Validate BCO
        run: |
          pip install check-jsonschema
          mkdir -p bco-schema
          for f in 2791object provenance_domain usability_domain description_domain execution_domain parametric_domain io_domain error_domain; do
            curl -sfL -o bco-schema/$f.json https://raw.githubusercontent.com/biocompute-objects/BCO_Documentation/main/ieee-2791-schema/$f.json
          done
          check-jsonschema --base-uri "file://$PWD/bco-schema/" --schemafile bco-schema/2791object.json results/bco.json
