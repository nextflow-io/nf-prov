name: nf-prov CI
on:
  push:
    branches:
      - 'main'
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
jobs:
  build:
    name: Build nf-prov
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        java_version: [17]
        nextflow_version: ['26.10']

    steps:
      - name: Environment
        run: env | sort

      - name: Checkout
        uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e # ratchet:actions/checkout@v1
        with:
          fetch-depth: 1
          submodules: true

      - name: Setup Java ${{ matrix.java_version }}
        uses: actions/setup-java@0f62d2ad8407a414cddd4790bed06fd9ebda0f56 # ratchet:actions/setup-java@v1
        with:
          java-version: ${{matrix.java_version}}
          architecture: x64
          distribution: 'temurin'

      - name: Unit tests
        run: make test
        env:
          GRADLE_OPTS: '-Dorg.gradle.daemon=false'

      - name: Setup Nextflow ${{ matrix.nextflow_version }}
        uses: nf-core/setup-nextflow@b9f764e8ba5c76b712ace14ecbfcef0e40ae2dd8 # v1
        with:
          version: "${{ matrix.nextflow_version }}"

      - name: Install
        run: make install

      - name: Test
        run: nextflow run nf-prov-test/ -plugins nf-prov@$(cat VERSION)

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # ratchet:actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate RO-Crate
        run: |
          pip install roc-validator
          rocrate-validator validate --no-paging --verbose -p provenance-run-crate-0.5 results

      - name: Validate BCO
        run: |
          pip install check-jsonschema rfc3987  # rfc3987 enables uri format checks
          scripts/validate-bco.sh results/bco.json
